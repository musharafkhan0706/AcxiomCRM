server:
  port: ${PORT:8085}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: acxiomcrm
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false

# Security & Business Configuration
acxiom:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:900000} # 15 minutes
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
    issuer: AcxiomCRM-Security
    audience: AcxiomCRM-Clients
  security:
    max-failed-attempts: ${LOCKOUT_MAX_ATTEMPTS:5}
    lockout-duration-minutes: ${LOCKOUT_DURATION_MINUTES:15}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  seed:
    admin-email: ${SEED_ADMIN_EMAIL:admin@acxiomcrm.com}
    admin-password: ${SEED_ADMIN_PASSWORD:Admin@Acxiom2026!}
    manager-email: ${SEED_MANAGER_EMAIL:manager@acxiomcrm.com}
    manager-password: ${SEED_MANAGER_PASSWORD:Manager@Acxiom2026!}
    sales1-email: ${SEED_SALES1_EMAIL:sales1@acxiomcrm.com}
    sales1-password: ${SEED_SALES1_PASSWORD:Sales@Acxiom2026!}
    sales2-email: ${SEED_SALES2_EMAIL:sales2@acxiomcrm.com}
    sales2-password: ${SEED_SALES2_PASSWORD:Sales@Acxiom2026!}

# OpenAPI Swagger Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

